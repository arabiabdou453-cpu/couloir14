<!doctype html>
<html lang="fr" dir="ltr" data-bs-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Écran de l'équipage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/vendor/leaflet.css"><link rel="stylesheet" href="/vendor/tabler.min.css"><link rel="stylesheet" href="/css/app.css">
<script src="/vendor/leaflet.js"></script>
</head>
<body>
<main class="page" id="page"></main>
<script type="module">
import { h, api, live, severityPill, MISSION, topbar, minutes, marker, baseMap, assessmentFacts, lightColor, lightLabel } from '/js/common.js';
const L = window.L, page = document.getElementById('page');
let map, layer, current = null, watch = null, wake = null, lastSend = 0, gpsState = '';

const mapEl = h('div', { id: 'unitMap' }), statusEl = h('div', {}), infoEl = h('div', {});
document.body.prepend(topbar("Écran de l'équipage"));
page.append(statusEl, mapEl, infoEl);
map = baseMap(L, mapEl); layer = L.layerGroup().addTo(map);

function startGps() {
  if (watch != null || !navigator.geolocation) return;
  watch = navigator.geolocation.watchPosition(p => {
    gpsState = 'ok';
    if (!current || current.simulated || Date.now() - lastSend < 5000) return;
    lastSend = Date.now();
    api(`/missions/${current.id}/position`, { lat: p.coords.latitude, lon: p.coords.longitude }).catch(() => {});
  }, () => { gpsState = 'denied'; }, { enableHighAccuracy: true, maximumAge: 3000 });
  if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {});
}
const action = name => async () => { try { await api(`/missions/${current.id}/action`, { action: name }); } catch (e) { alertLine(e.message); } };
const alertLine = t => statusEl.prepend(h('p', { class: 'error', role: 'alert' }, t));
const NEXT = { sent: ['accept', 'Accepter la mission'], accepted: ['arrive_scene', "Arrivé sur les lieux"], on_scene: ['leave_scene', "Départ vers l'hôpital"], to_hospital: ['arrive_hospital', "Arrivé à l'hôpital"] };

const STEPS = [['sent', 'Mission'], ['accepted', 'Trajet'], ['on_scene', 'Sur place'], ['to_hospital', 'Hôpital']];
let framed = '';
live(s => {
  const m = s.mission; current = m;
  const n = m && NEXT[m.status];
  statusEl.replaceChildren(h('div', { class: 'card' + (m && m.status === 'sent' ? ' alert' : '') },
    h('div', { class: 'row' }, h('h2', {}, s.unit.name), m ? h('span', { class: 'pill' }, MISSION[m.status]) : h('span', { class: 'pill ok' }, 'Disponible')),
    !m && h('p', { class: 'muted' }, "Aucune mission. Elle s'affichera ici dès son envoi."),
    m && h('ol', { class: 'stepper', 'aria-label': 'Étapes de la mission' }, STEPS.map(([key, label], k) => {
      const at = STEPS.findIndex(x => x[0] === m.status);
      return h('li', { class: k < at ? 'done' : k === at ? 'now' : '', 'aria-current': k === at ? 'step' : null }, label);
    })),
    m && h('div', { class: 'row' }, h('span', { class: 'big' }, minutes(m.etaLeftS)), h('span', { class: 'muted' }, m.routeSource === 'osrm' ? 'Sans le trafic en direct' : 'Estimation à vol d\'oiseau')),
    n && h('button', { type: 'button', class: 'big-btn ' + (m.status === 'sent' ? 'primary' : 'go'), onclick: async () => { startGps(); await action(n[0])(); } }, n[1]),
    m && !m.simulated && gpsState === 'denied' && h('p', { class: 'error' }, "Position indisponible : activez le GPS ou prévenez l'agent par radio."),
    m && m.status !== 'sent' && h('p', { class: 'muted' }, "Gardez cette page ouverte et l'écran allumé pour que votre position arrive.")));
  layer.clearLayers();
  if (m) {
    if (m.route) { const line = L.polyline(m.route.map(c => [c[1], c[0]]), { color: '#4a9bd9', weight: 6 }).addTo(layer); const key = `${m.id}:${m.status}`; if (key !== framed) { framed = key; map.fitBounds(line.getBounds(), { maxZoom: 16, padding: [20, 20] }); } }
    marker(L, 'ambulance', m.unit.lat, m.unit.lon, s.unit.name).addTo(layer);
    if (s.incident.lat != null && ['sent', 'accepted', 'on_scene'].includes(m.status)) marker(L, 'accident', s.incident.lat, s.incident.lon, 'Accident').addTo(layer);
    if (m.hospital) marker(L, 'hospital', m.hospital.lat, m.hospital.lon, m.hospital.name).addTo(layer);
    for (const p of m.priority) L.circleMarker([p.lat, p.lon], { radius: 9, color: lightColor(p.status), weight: 3, fillOpacity: .5 }).bindTooltip(lightLabel(p)).addTo(layer);
  }
  if (!infoEl.contains(document.activeElement) || document.activeElement.tagName !== 'INPUT') {
    const a = s.incident && s.incident.assessment;
    infoEl.replaceChildren(!m ? '' : h('div', { class: 'card' },
      h('div', { class: 'row' }, h('h3', {}, 'Accident'), severityPill(s.incident.severity)), s.incident.road_label && h('p', {}, s.incident.road_label),
      h('div', { class: 'facts' }, assessmentFacts(a)),
      m.hospital && h('p', {}, 'Hôpital : ', h('b', {}, m.hospital.name), ` (${m.ackPending ? 'en attente de confirmation' : 'alerte reçue'})`),
      m.priority.length > 0 && h('p', { class: 'muted' }, `Feux sur le trajet : ${m.priority.length} (simulation, aucun feu réel n'est commandé)`),
      m.status === 'on_scene' && h('form', { class: 'row', onsubmit: async e => { e.preventDefault(); try { await api(`/missions/${m.id}/victims`, { victims: +e.target.v.value }); e.target.v.blur(); } catch (x) { alertLine(x.message); } } },
        h('label', { class: 'grow' }, 'Nombre de victimes sur place', h('input', { name: 'v', type: 'number', min: 0, value: a ? a.victims : 1 })), h('button', { type: 'submit' }, 'Mettre à jour'))));
  }
  if (m && m.status !== 'sent') startGps();
});
</script>
</body>
</html>

<!doctype html>
<html lang="fr" dir="ltr" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couloir 14 · Terminal Mobile Équipage (MDT)</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/vendor/tabler.min.css">
<link rel="stylesheet" href="/css/app.css">
<script src="/vendor/leaflet.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="app-rail">
    <a class="rail-brand" href="/" title="Couloir 14">
      <svg viewBox="0 0 32 32" style="width:24px;height:24px;" aria-hidden="true">
        <path fill="#e5484d" d="M21 5.5a12 12 0 1 0 0 21 9.6 9.6 0 1 1 0-21Z"/>
        <path d="M15 16h13m-4-4 4 4-4 4" fill="none" stroke="#2bb673" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <nav class="rail-nav">
      <a class="rail-item" href="/dispatch" title="Régulation CAD 14">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </a>
      <a class="rail-item active" href="/unit" title="Équipage Ambulance">
        <svg viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-1.1 0-2 .9-2 2v7h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
      </a>
      <a class="rail-item" href="/er" title="Urgences Hôpital">
        <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16M9 9h6M12 6v6"/></svg>
      </a>
      <a class="rail-item" href="/metrics" title="Délais & Performance">
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18M7 16l4-4 4 4 5-6"/></svg>
      </a>
      <a class="rail-item" href="/twin" title="Jumeau SUMO">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m4.93 4.93 4.24 4.24M14.83 9.17l4.24-4.24M14.83 14.83l4.24 4.24M9.17 14.83l-4.24 4.24"/></svg>
      </a>
    </nav>
    <div class="rail-foot">
      <a class="rail-item" href="/" title="Présentation publique" target="_blank">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </a>
    </div>
  </aside>

  <div class="app-main">
    <div style="flex:1; overflow-y:auto; padding:20px 16px;">
      <main class="page" id="page" style="max-width:720px; margin:0 auto; display:grid; gap:14px;"></main>
    </div>
  </div>
</div>

<script type="module">
import { h, api, live, severityPill, MISSION, topbar, minutes, marker, baseMap, assessmentFacts, lightColor, lightLabel, lightsNote } from '/js/common.js';
const L = window.L, page = document.getElementById('page');
const mainEl = document.querySelector('.app-main');
mainEl.prepend(topbar("Terminal Embarqué Équipage (MDT)", []));

let map, layer, current = null, watch = null, wake = null, lastSend = 0, gpsState = '';

const mapEl = h('div', { id: 'unitMap' }), statusEl = h('div', {}), infoEl = h('div', {});
page.append(statusEl, mapEl, infoEl);
map = baseMap(L, mapEl); layer = L.layerGroup().addTo(map);

function startGps() {
  if (watch != null || !navigator.geolocation) return;
  watch = navigator.geolocation.watchPosition(p => {
    gpsState = 'ok';
    if (!current || current.simulated || Date.now() - lastSend < 5000) return;
    lastSend = Date.now();
    api(`/missions/${current.id}/position`, { lat: p.coords.latitude, lon: p.coords.longitude }).catch(() => {});
  }, () => { gpsState = 'denied'; }, { enableHighAccuracy: true, maximumAge: 3000 });
  if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {});
}
const action = name => async () => { try { await api(`/missions/${current.id}/action`, { action: name }); } catch (e) { alertLine(e.message); } };
const alertLine = t => statusEl.prepend(h('p', { class: 'error', role: 'alert' }, t));
const NEXT = {
  sent: ['accept', 'ACCEPTER LA MISSION'],
  accepted: ['arrive_scene', "ARRIVÉE SUR LES LIEUX"],
  on_scene: ['leave_scene', "DÉPART VERS L'HÔPITAL"],
  to_hospital: ['arrive_hospital', "ARRIVÉE AUX URGENCES"]
};

const STEPS = [['sent', '01 Alerte'], ['accepted', '02 En route'], ['on_scene', '03 Sur place'], ['to_hospital', '04 Évacuation']];
let framed = '';
live(s => {
  const m = s.mission; current = m;
  const n = m && NEXT[m.status];
  statusEl.replaceChildren(h('div', { class: 'card' + (m && m.status === 'sent' ? ' alert' : '') },
    h('div', { style: 'display:flex; justify-content:space-between; align-items:center;' },
      h('h2', { style: 'font-size:18px; font-weight:700;' }, s.unit.name),
      m ? h('span', { class: 'pill ok' }, MISSION[m.status]) : h('span', { class: 'pill ok' }, 'Unité disponible')
    ),
    !m && h('p', { class: 'muted', style: 'padding:14px 0;' }, "Aucune mission active. L'ordre de départ s'affichera ici dès l'alerte du 14."),
    m && h('ol', { class: 'stepper', 'aria-label': 'Étapes de la mission' }, STEPS.map(([key, label], k) => {
      const at = STEPS.findIndex(x => x[0] === m.status);
      return h('li', { class: k < at ? 'done' : k === at ? 'now' : '', 'aria-current': k === at ? 'step' : null }, label);
    })),
    m && h('div', { style: 'display:flex; justify-content:space-between; align-items:baseline; margin:6px 0;' },
      h('span', { class: 'big', style: 'font-weight:700; color:var(--open);' }, minutes(m.etaLeftS)),
      h('span', { class: 'muted', style: 'font-size:12.5px;' }, m.routeSource === 'osrm' ? 'Itinéraire optimisé' : 'Calcul estimatif direct')
    ),
    n && h('button', {
      type: 'button',
      class: 'btn big-btn ' + (m.status === 'sent' ? 'primary' : 'go'),
      style: 'font-size:18px; letter-spacing:.02em;',
      onclick: async () => { startGps(); await action(n[0])(); }
    }, n[1]),
    m && !m.simulated && gpsState === 'denied' && h('p', { class: 'error' }, "Signal GPS indisponible : activez la géolocalisation ou contactez le 14 par radio."),
    m && m.status !== 'sent' && h('p', { class: 'muted', style: 'font-size:11.5px; text-align:center;' }, "Télémétrie active · Écran maintenu allumé pour le suivi de position.")
  ));

  layer.clearLayers();
  if (m) {
    if (m.route) {
      const line = L.polyline(m.route.map(c => [c[1], c[0]]), { color: '#1e90ff', weight: 6, opacity: .9 }).addTo(layer);
      const key = `${m.id}:${m.status}`;
      if (key !== framed) { framed = key; map.fitBounds(line.getBounds(), { maxZoom: 16, padding: [24, 24] }); }
    }
    marker(L, 'ambulance', m.unit.lat, m.unit.lon, s.unit.name).addTo(layer);
    if (s.incident.lat != null && ['sent', 'accepted', 'on_scene'].includes(m.status)) marker(L, 'accident', s.incident.lat, s.incident.lon, 'Lieu de l\'accident').addTo(layer);
    if (m.hospital) marker(L, 'hospital', m.hospital.lat, m.hospital.lon, m.hospital.name).addTo(layer);
    for (const p of m.priority) L.circleMarker([p.lat, p.lon], { radius: 9, color: lightColor(p.status), weight: 3, fillOpacity: .5 }).bindTooltip(lightLabel(p)).addTo(layer);
  }

  if (!infoEl.contains(document.activeElement) || document.activeElement.tagName !== 'INPUT') {
    const a = s.incident && s.incident.assessment;
    infoEl.replaceChildren(!m ? '' : h('div', { class: 'card' },
      h('div', { style: 'display:flex; justify-content:space-between; align-items:center;' },
        h('h3', {}, `Dossier Accident #${s.incident.id}`),
        severityPill(s.incident.severity)
      ),
      s.incident.road_label && h('p', { style: 'font-weight:600; color:#fff;' }, s.incident.road_label),
      h('div', { class: 'facts' }, assessmentFacts(a)),
      m.hospital && h('div', { style: 'margin-top:8px; padding:10px; background:var(--panel-2); border-radius:6px; border:1px solid var(--line);' },
        h('span', { class: 'muted', style: 'display:block; font-size:12px;' }, 'HÔPITAL DESTINATAIRE :'),
        h('b', { style: 'color:#fff;' }, m.hospital.name),
        h('span', { class: `pill ${m.ackPending ? 'warn' : 'ok'}`, style: 'margin-inline-start:8px;' }, m.ackPending ? 'Alerte transmise (en attente)' : 'Équipe d\'accueil prête')
      ),
      m.priority.length > 0 && h('p', { class: 'muted', style: 'font-size:12px; margin-top:4px;' }, lightsNote(m.priority)),
      m.status === 'on_scene' && h('form', {
        class: 'row',
        style: 'margin-top:12px; padding-top:12px; border-top:1px solid var(--line);',
        onsubmit: async e => {
          e.preventDefault();
          try { await api(`/missions/${m.id}/victims`, { victims: +e.target.v.value }); e.target.v.blur(); }
          catch (x) { alertLine(x.message); }
        }
      },
        h('label', { class: 'grow', style: 'font-weight:600;' }, 'Bilan victimes sur place :',
          h('input', { name: 'v', type: 'number', min: 0, class: 'form-control', value: a ? a.victims : 1 })
        ),
        h('button', { type: 'submit', class: 'btn go' }, 'Actualiser le bilan')
      )
    ));
  }
  if (m && m.status !== 'sent') startGps();
});
</script>
</body>
</html>

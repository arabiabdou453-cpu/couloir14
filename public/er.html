<!doctype html>
<html lang="fr" dir="ltr" data-bs-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Écran des urgences</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/vendor/tabler.min.css"><link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="page board" id="page"></main>
<script type="module">
import { h, api, live, severityPill, MISSION, topbar, minutes, assessmentFacts } from '/js/common.js';
const page = document.getElementById('page');
document.body.prepend(topbar('Écran des urgences'));
let audio = null, sound = false, known = '';
const soundBtn = h('button', { type: 'button', onclick: () => { audio = audio || new AudioContext(); audio.resume(); sound = true; soundBtn.textContent = 'Alerte sonore activée'; soundBtn.disabled = true; } }, "Activer l'alerte sonore");
const beep = () => { if (!sound) return; const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.value = .2; o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + .4); };
const post = path => async () => { try { await api(path, {}); } catch (e) { page.prepend(h('p', { class: 'error', role: 'alert' }, e.message)); } };

live(s => {
  const waiting = s.incoming.filter(m => m.ackPending).map(m => m.id).join();
  if (waiting && waiting !== known) beep();
  known = waiting;
  const next = s.incoming.reduce((a, m) => (m.etaLeftS != null && (a == null || m.etaLeftS < a) ? m.etaLeftS : a), null);
  const pendingCount = s.incoming.filter(m => m.ackPending).length;
  page.replaceChildren(
    h('div', { class: 'board-kpis' },
      h('div', {}, h('b', {}, String(s.incoming.length)), h('span', {}, 'ambulances attendues')),
      h('div', {}, h('b', { class: pendingCount ? 'bad' : '' }, String(pendingCount)), h('span', {}, 'alertes à confirmer')),
      h('div', {}, h('b', {}, minutes(next)), h('span', {}, 'prochaine arrivée'))),
    h('div', { class: 'card' },
      h('div', { class: 'row' }, h('h2', {}, s.hospital.name), h('span', { class: `pill ${s.hospital.available ? 'ok' : 'bad'}` }, s.hospital.available ? 'Disponible' : 'Complet')),
      h('div', { class: 'row' },
        h('button', { type: 'button', onclick: async () => { await api('/hospital/status', { available: !s.hospital.available }); } }, s.hospital.available ? "Déclarer l'hôpital complet" : "Déclarer l'hôpital disponible"),
        soundBtn)),
    h('div', { class: 'board-list' }, s.incoming.length ? s.incoming.sort((a, b) => (a.etaLeftS ?? 1e9) - (b.etaLeftS ?? 1e9)).map(m => h('div', { class: 'card' + (m.ackPending ? ' alert' : '') },
      h('div', { class: 'row' }, h('h2', {}, `Accident ${m.incident.id}`), severityPill(m.incident.severity), h('span', { class: 'pill' }, MISSION[m.status] || m.status)),
      h('div', { class: 'row' }, h('span', { class: 'big' }, minutes(m.etaLeftS)), h('span', { class: 'muted' }, m.routeSource === 'osrm' ? 'Durée estimée, sans le trafic en direct' : 'Durée estimée, approximative')),
      h('div', { class: 'facts' }, assessmentFacts(m.incident.assessment)),
      h('p', { class: 'muted' }, `Unité : ${m.unit.name}`),
      h('div', { class: 'row' },
        m.ackPending ? h('button', { type: 'button', class: 'primary big-btn', onclick: post(`/missions/${m.id}/ack`) }, "J'ai reçu l'alerte") : h('span', { class: 'pill ok' }, 'Réception confirmée'),
        !m.ackPending && !m.readyAt && h('button', { type: 'button', class: 'go', onclick: post(`/missions/${m.id}/ready`) }, "L'équipe est prête"),
        m.readyAt && h('span', { class: 'pill ok' }, "L'équipe est prête")))) : [h('div', { class: 'card' }, h('p', { class: 'muted' }, "Aucun blessé attendu. L'alerte s'affichera ici dès qu'une unité sera envoyée vers vous."))]));
});
</script>
</body>
</html>

<!doctype html>
<html lang="fr" dir="ltr" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couloir 14 · Accueil des Urgences Hospitalières</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/vendor/tabler.min.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-rail">
    <a class="rail-brand" href="/" title="Couloir 14">
      <svg viewBox="0 0 32 32" style="width:24px;height:24px;" aria-hidden="true">
        <path fill="#e5484d" d="M21 5.5a12 12 0 1 0 0 21 9.6 9.6 0 1 1 0-21Z"/>
        <path d="M15 16h13m-4-4 4 4-4 4" fill="none" stroke="#2bb673" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <nav class="rail-nav">
      <a class="rail-item" href="/dispatch" title="Régulation CAD 14">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </a>
      <a class="rail-item" href="/unit" title="Équipage Ambulance">
        <svg viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-1.1 0-2 .9-2 2v7h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
      </a>
      <a class="rail-item active" href="/er" title="Urgences Hôpital">
        <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16M9 9h6M12 6v6"/></svg>
      </a>
      <a class="rail-item" href="/metrics" title="Délais & Performance">
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18M7 16l4-4 4 4 5-6"/></svg>
      </a>
      <a class="rail-item" href="/twin" title="Jumeau SUMO">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m4.93 4.93 4.24 4.24M14.83 9.17l4.24-4.24M14.83 14.83l4.24 4.24M9.17 14.83l-4.24 4.24"/></svg>
      </a>
    </nav>
    <div class="rail-foot">
      <a class="rail-item" href="/" title="Présentation publique" target="_blank">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </a>
    </div>
  </aside>

  <div class="app-main">
    <div style="flex:1; overflow-y:auto; padding:20px 24px;">
      <main class="page board" id="page"></main>
    </div>
  </div>
</div>

<script type="module">
import { h, api, live, severityPill, MISSION, topbar, minutes, assessmentFacts } from '/js/common.js';
const page = document.getElementById('page');
const mainEl = document.querySelector('.app-main');
mainEl.prepend(topbar("Plateau Technique & Urgences Hospitalières", []));

let audio = null, sound = false, known = '';
const soundBtn = h('button', {
  type: 'button',
  class: 'btn btn-outline-warning',
  onclick: () => {
    audio = audio || new AudioContext();
    audio.resume();
    sound = true;
    soundBtn.innerHTML = '🔊 Alerte sonore activée';
    soundBtn.disabled = true;
  }
}, "🔔 Activer l'alerte sonore");

const beep = () => {
  if (!sound) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = 880; g.gain.value = .25;
  o.connect(g).connect(audio.destination);
  o.start(); o.stop(audio.currentTime + .4);
};

const post = path => async () => {
  try { await api(path, {}); }
  catch (e) { page.prepend(h('p', { class: 'error', role: 'alert' }, e.message)); }
};

live(s => {
  const waiting = s.incoming.filter(m => m.ackPending).map(m => m.id).join();
  if (waiting && waiting !== known) beep();
  known = waiting;
  const next = s.incoming.reduce((a, m) => (m.etaLeftS != null && (a == null || m.etaLeftS < a) ? m.etaLeftS : a), null);
  const pendingCount = s.incoming.filter(m => m.ackPending).length;

  page.replaceChildren(
    // 1. KPI Cards
    h('div', { class: 'board-kpis' },
      h('div', {},
        h('b', {}, String(s.incoming.length)),
        h('span', {}, 'Ambulances attendues')
      ),
      h('div', {},
        h('b', { class: pendingCount ? 'bad' : '' }, String(pendingCount)),
        h('span', {}, 'Alertes à confirmer')
      ),
      h('div', {},
        h('b', { style: 'color: var(--open);' }, minutes(next)),
        h('span', {}, 'Prochaine arrivée estimée (ETA)')
      )
    ),

    // 2. Hospital Service Card
    h('div', { class: 'card' },
      h('div', { style: 'display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;' },
        h('div', { style: 'display:flex; align-items:center; gap:12px;' },
          h('h2', { style: 'font-size:20px; font-weight:700;' }, s.hospital.name),
          h('span', { class: `pill ${s.hospital.available ? 'ok' : 'bad'}` }, s.hospital.available ? 'Plateau Technique Disponible' : 'Service Saturé / Dérivation')
        ),
        h('div', { style: 'display:flex; gap:10px;' },
          h('button', {
            type: 'button',
            class: `btn ${s.hospital.available ? 'btn-outline-danger' : 'btn-outline-success'}`,
            onclick: async () => { await api('/hospital/status', { available: !s.hospital.available }); }
          }, s.hospital.available ? "Déclarer le service complet" : "Déclarer le service disponible"),
          soundBtn
        )
      )
    ),

    // 3. Incoming Trauma List
    h('div', { class: 'board-list' }, s.incoming.length ? s.incoming.sort((a, b) => (a.etaLeftS ?? 1e9) - (b.etaLeftS ?? 1e9)).map(m => h('div', { class: 'card' + (m.ackPending ? ' alert' : '') },
      h('div', { style: 'display:flex; justify-content:space-between; align-items:center;' },
        h('h2', { style: 'font-size:18px;' }, `Accident #${m.incident.id}`),
        severityPill(m.incident.severity),
        h('span', { class: 'pill ok' }, MISSION[m.status] || m.status)
      ),
      h('div', { style: 'display:flex; justify-content:space-between; align-items:baseline; margin:6px 0;' },
        h('span', { class: 'big', style: 'font-weight:700; color:var(--open); font-size:36px;' }, minutes(m.etaLeftS)),
        h('span', { class: 'muted', style: 'font-size:12px;' }, m.routeSource === 'osrm' ? 'Itinéraire direct optimisé' : 'Calcul estimatif direct')
      ),
      h('div', { class: 'facts' }, assessmentFacts(m.incident.assessment)),
      h('div', { style: 'font-size:13px; color:var(--ink-2); margin-top:4px;' },
        h('b', {}, 'Vecteur d\'évacuation : '),
        h('span', {}, m.unit.name)
      ),
      h('div', { style: 'display:flex; gap:10px; margin-top:8px;' },
        m.ackPending ? h('button', {
          type: 'button',
          class: 'btn primary big-btn',
          onclick: post(`/missions/${m.id}/ack`)
        }, "J'AI REÇU L'ALERTE (CONFIRMER)") : h('span', { class: 'pill ok', style: 'padding:8px 14px;' }, '✓ Réception confirmée par le service'),

        !m.ackPending && !m.readyAt && h('button', {
          type: 'button',
          class: 'btn go big-btn',
          onclick: post(`/missions/${m.id}/ready`)
        }, "L'ÉQUIPE CHIRURGICALE EST PRÊTE"),

        m.readyAt && h('span', { class: 'pill ok', style: 'padding:8px 14px;' }, '✓ Équipe chirurgicale prête')
      )
    )) : [h('div', { class: 'card', style: 'grid-column: 1 / -1; text-align:center; padding:32px;' },
      h('p', { class: 'muted', style: 'font-size:15px;' }, "Aucun blessé en cours d'évacuation vers votre structure."),
      h('p', { class: 'muted', style: 'font-size:13px; margin-top:4px;' }, "L'alerte sonore et la fiche patient apparaîtront automatiquement dès qu'une unité sera dirigée vers vous.")
    )])
  );
});
</script>
</body>
</html>

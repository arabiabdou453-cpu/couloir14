<!doctype html>
<html lang="fr" dir="ltr" data-bs-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/vendor/tabler.min.css"><link rel="stylesheet" href="/css/app.css">
</head>
<body>
<form class="login card" id="form">
  <a class="login-brand product" href="/"><svg class="crescent" viewBox="0 0 32 32" aria-hidden="true"><path fill="#e5484d" d="M21 5.5a12 12 0 1 0 0 21 9.6 9.6 0 1 1 0-21Z"/><path d="M15 16h13m-4-4 4 4-4 4" fill="none" stroke="#2bb673" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Couloir 14</a>
  <h2>Connexion</h2>
  <label>Je suis<select class="form-select" id="role"><option value="operator">Agent de la Protection civile</option><option value="crew">Équipage d'ambulance</option><option value="hospital">Hôpital</option></select></label>
  <label id="whichBox" hidden><span id="whichLabel"></span><select class="form-select" id="which"></select></label>
  <label>Code<input class="form-control" id="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
  <p class="error" id="msg" role="alert"></p>
  <button class="btn btn-danger" type="submit">Se connecter</button>
</form>
<script type="module">
import { api } from '/js/common.js';
const o = await api('/login-options'), $ = id => document.getElementById(id);
function fill() {
  const r = $('role').value, list = r === 'crew' ? o.units : r === 'hospital' ? o.hospitals : null;
  $('whichBox').hidden = !list;
  if (!list) return;
  $('whichLabel').textContent = r === 'crew' ? 'Unité' : 'Hôpital';
  $('which').replaceChildren(...list.map(x => Object.assign(document.createElement('option'), { value: x.id, textContent: x.name })));
}
$('role').addEventListener('change', fill); fill();
$('form').addEventListener('submit', async e => {
  e.preventDefault(); $('msg').textContent = '';
  try {
    const r = await api('/login', { role: $('role').value, id: +$('which').value || 0, pin: $('pin').value });
    location.href = r.role === 'operator' ? '/dispatch' : r.role === 'crew' ? '/unit' : '/er';
  } catch (x) { $('msg').textContent = x.message; }
});
</script>
</body>
</html>
